services:
  - type: web
    name: retainiq
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import run; run.setup()"
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RETAINIQ_TICK_SEC
        value: "120"
